name: Monitor Esfera Disney

on:
  schedule:
    # Horário ajustado para Brasília (UTC-3):
    # 03:15, 09:15, 15:15 e 21:15 UTC equivalem a 00:15, 06:15, 12:15 e 18:15 no Brasil
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo botão no site quando quiser

jobs:
  executar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Executar monitoramento Esfera
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python esfera_monitor.py
